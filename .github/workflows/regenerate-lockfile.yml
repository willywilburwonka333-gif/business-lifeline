name: Regenerate lockfile for first-client pilot
on:
  push:
    branches:
      - fix/pilot-release-lockfile-20261009
permissions:
  contents: write
jobs:
  repair-lockfile:
    if: github.ref == 'refs/heads/fix/pilot-release-lockfile-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Validate clean deterministic install
        run: npm ci --no-audit --no-fund
      - name: Validate tests
        run: npm run test
      - name: Push branch-only lockfile update
        run: |
          git status --short
          git diff --stat -- package-lock.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate reproducible npm package-lock.json"
            git push origin HEAD:fix/pilot-release-lockfile-20261009
          fi
